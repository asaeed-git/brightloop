[project]
name = "brightloop"
version = "0.1.0"
description = "Brightloop subscription management"
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "tmp", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["I"]
