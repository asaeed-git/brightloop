{% extends 'base.html' %}
{% block title %}{{ title }} · Brightloop{% endblock %}
{% block content %}
  <div class="page-heading">
    <p class="eyebrow"><a href="{% url 'billing:tax_list' %}">← Tax Rates</a></p>
    <h1>{{ title }}</h1>
  </div>

  <div class="panel" style="max-width:560px">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'components/form_fields.html' with form=form %}
      <div style="display:flex;gap:12px;margin-top:16px">
        <button type="submit" class="button button--primary">Save Tax Rate</button>
        <a href="{% url 'billing:tax_list' %}" class="button">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
