{% extends 'base.html' %}
{% block title %}{{ title }} · Brightloop{% endblock %}
{% block content %}
  <div class="page-heading">
    <p class="eyebrow"><a href="{% url 'catalog:product_list' %}">← Products</a></p>
    <h1>{{ title }}</h1>
  </div>

  <div class="panel" style="max-width:640px">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'components/form_fields.html' with form=form %}
      <div style="display:flex;gap:12px;margin-top:16px">
        <button type="submit" class="button button--primary">Save Product</button>
        {% if product %}
          <a href="{% url 'catalog:product_detail' pk=product.pk %}" class="button">Cancel</a>
        {% else %}
          <a href="{% url 'catalog:product_list' %}" class="button">Cancel</a>
        {% endif %}
      </div>
    </form>
  </div>
{% endblock %}
